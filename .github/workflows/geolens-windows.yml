name: Build GeoLens (Windows .exe)

on:
  push:
    branches: ["**"]          # listing only `tags` would silently skip branch pushes
    tags: ["geolens-v*"]
    paths: ["geolens/**", ".github/workflows/geolens-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: geolens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: geolens/requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
          # rapidocr pulls opencv-python 5.x, which dropped Haar cascades: force the 4.x headless build
          pip uninstall -y opencv-python opencv-python-headless
          pip install --no-deps "opencv-python-headless>=4.8,<5"
          python -c "import cv2; assert hasattr(cv2, 'CascadeClassifier'), cv2.__version__; print('cv2', cv2.__version__)"

      - name: Offline tests (tiny random CLIP, OCR, EXIF, sun maths)
        run: |
          python tests/make_tiny_clip.py "$env:RUNNER_TEMP\tinyclip"
          python tests/test_pipeline.py "$env:RUNNER_TEMP\tinyclip"

      - name: Build with PyInstaller
        run: pyinstaller GeoLens.spec --noconfirm

      - name: Smoke-test the frozen exe (server + UI + API)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GeoLens\GeoLens.exe -ArgumentList "--browser","--port","8799","--no-vision" -PassThru
          Start-Sleep -Seconds 25
          $r = Invoke-RestMethod http://127.0.0.1:8799/api/status
          $html = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if (-not $html.Content.Contains("GeoLens")) { throw "UI not served" }
          Stop-Process -Id $p.Id -Force
          Write-Host "status ok: $($r.settings | ConvertTo-Json -Compress)"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip (portable)
        shell: pwsh
        run: |
          Set-Content dist\GeoLens\README-FIRST.txt "Unzip the WHOLE folder first, then run GeoLens.exe from inside it. GeoLens.exe needs the _internal folder next to it - do not move or copy the exe on its own, and do not run it from inside the zip."
          Compress-Archive -Path dist\GeoLens -DestinationPath dist\GeoLens-portable-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLens-Setup
          path: geolens/dist/GeoLens-Setup.exe
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLens-portable-windows-x64
          path: geolens/dist/GeoLens-portable-windows-x64.zip
          retention-days: 30
          compression-level: 0

      - name: Publish rolling download (geolens-latest)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete geolens-latest --cleanup-tag -y --repo ${{ github.repository }} 2>$null
          $global:LASTEXITCODE = 0
          gh release create geolens-latest dist/GeoLens-Setup.exe dist/GeoLens-portable-windows-x64.zip `
            --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease `
            --title "GeoLens (latest build)" `
            --notes "Automatic Windows build of ${{ github.sha }}. Download GeoLens-Setup.exe and run it (per-user install, no admin). Portable: unzip the whole folder and run GeoLens.exe inside it."

      - name: Publish release (on geolens-v* tags)
        if: startsWith(github.ref, 'refs/tags/geolens-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geolens/dist/GeoLens-Setup.exe
            geolens/dist/GeoLens-portable-windows-x64.zip
